[project]
name = "rag-project"
version = "0.1.0"
description = "Multi-channel RAG over the Warhammer 40k Core Rules (PDF) and unit datasheets (SQLite)"
authors = [
    { name = "Weronika Biegowska" },
    { name = "Ala Karamkesh" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.33.0",
    "jinja2>=3.1.6",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.15.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "snowballstemmer>=3.1.1",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ragas says evaluate() will change in its next big version, nothing to do for us
filterwarnings = ['ignore:a?evaluate\(\) is deprecated:DeprecationWarning']

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
eval = [
    "langchain-community<0.4.2",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.6",
]
parse = [
    "docling>=2.143.0",
]
